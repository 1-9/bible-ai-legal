<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible AI: Study Assistant — Legal</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --accent: #6b4fbb;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14121a;
      --fg: #eee8f7;
      --muted: #b3a9c9;
      --accent: #b79dfd;
      --border: #2c2740;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    max-width: 480px;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  p { color: var(--muted); margin-bottom: 28px; }
  .links a {
    display: block;
    padding: 14px 18px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .links a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bible AI: Study Assistant</h1>
  <p>Legal documents for the Bible AI mobile app (com.antigravity.bible_ai)</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>
</div>
</body>
</html>
